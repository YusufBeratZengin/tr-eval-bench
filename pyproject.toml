[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tr-eval-bench"
version = "0.1.0"
description = "Offline-first benchmark for Turkish text embeddings and RAG retrieval, runnable on CPU in under a minute with cached models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Berat Zengin" }]
keywords = [
  "turkish-nlp",
  "embedding",
  "rag",
  "mteb",
  "benchmark",
  "retrieval",
  "evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
]

[project.optional-dependencies]
hf = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/tr-eval-bench"
Repository = "https://github.com/YusufBeratZengin/tr-eval-bench"
Changelog = "https://github.com/YusufBeratZengin/tr-eval-bench/blob/main/CHANGELOG.md"
Issues = "https://github.com/YusufBeratZengin/tr-eval-bench/issues"

[project.scripts]
tr-eval-bench = "tr_eval_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tr_eval_bench"]

[tool.hatch.build.targets.sdist]
include = [
  "tr_eval_bench",
  "tests",
  "scripts",
  "README.md",
  "README.tr.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["tr_eval_bench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["tr_eval_bench"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

# sentence-transformers pulls in torch/transformers, whose type surface is
# enormous: analysing it takes gigabytes of RAM and minutes of CPU while adding
# nothing to this codebase (the optional import is already guarded at runtime).
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: downloads a model or needs network (skipped unless TR_EVAL_HF_TEST=1)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["tr_eval_bench"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
