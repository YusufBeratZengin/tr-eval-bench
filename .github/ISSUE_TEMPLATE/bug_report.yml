name: Bug report
description: Something failed or produced a wrong score
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, tokens or private data —
        scores and model names are enough.
  - type: input
    id: version
    attributes:
      label: tr-eval-bench version
      description: Output of `pip show tr-eval-bench | head -2` or `tr-eval-bench --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, CPU/GPU, and whether the model was already cached.
      placeholder: "Ubuntu 24.04, Python 3.12, CPU only"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and full output
      description: The exact command you ran and the terminal output (or the JSON report).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: For wrong scores, mention the metric and the value you expected.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Hugging Face (sentence-transformers)
        - OpenAI-compatible API (Ollama / vLLM / TGI)
        - hashing baseline
        - diff / reporting
        - datasets
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I ran `tr-eval-bench datasets --verify` and it passed (for dataset-related reports).
        - label: This report contains no secrets or personal data.
          required: true
